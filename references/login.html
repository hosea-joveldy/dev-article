<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang — Sign in</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="background:var(--cream);min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;">
<header class="topbar" style="background:#fff;"><div class="container nav">
  <a class="brand" href="index.html">Ruang.</a>
  <nav class="navlinks"><a href="register.html" class="pill">Get started</a></nav>
</div></header>

<main class="container">
  <div class="form-card">
    <h1 class="serif" style="font-size:32px;margin:0 0 8px;font-weight:400;">Welcome back.</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 24px;">Sign in to explore stories and share your ideas.</p>

    <form style="display:flex;flex-direction:column;gap:18px;">
      <div>
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="name@example.com">
      </div>
      <div>
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="••••••••">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">
        <label style="display:flex;align-items:center;gap:6px;color:#555;"><input type="checkbox"> Remember me</label>
        <a href="#" style="text-decoration:underline;color:var(--muted);">Forgot password?</a>
      </div>
      <button type="button" class="pill" style="width:100%;margin-top:8px;">Sign in</button>
    </form>
    <div style="text-align:center;font-size:13px;color:var(--muted);margin-top:20px;">
      No account yet? <a href="register.html" style="text-decoration:underline;color:var(--ink);font-weight:600;">Create one</a>
    </div>
  </div>
</main>

<footer class="footer"><div class="container footer-inner"><span>© 2026 Ruang Editorial</span><div class="footer-links"><a href="#">About</a><a href="#">Privacy</a><a href="#">Contact</a></div></div></footer>
</body></html>
