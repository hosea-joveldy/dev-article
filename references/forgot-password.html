<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang — Reset Password</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div class="container nav">
  <a class="brand" href="index.html">Ruang.</a>
  <nav class="navlinks"><a href="login.html" class="pill">Sign in</a></nav>
</div></header>

<main class="container">
  <div class="form-card">
    <h1 class="serif" style="font-size:32px;margin:0 0 10px;font-weight:400;text-align:center;">Reset Password</h1>
    <p style="color:var(--muted);font-size:14px;text-align:center;margin:0 0 28px;">
      Forgot your password? Enter your email address and we will email you a password reset link.
    </p>

    <form style="display:flex;flex-direction:column;gap:18px;">
      <div class="form-group" style="margin:0;">
        <label class="form-label">Email address</label>
        <input type="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <button type="button" class="pill" style="width:100%;margin-top:8px;">Send reset link</button>
    </form>

    <div style="margin-top:24px;text-align:center;font-size:13px;color:var(--muted);">
      Remember your password? <a href="login.html" style="color:var(--ink-strong);font-weight:600;">Back to sign in</a>
    </div>
  </div>
</main>

<footer class="footer"><div class="container footer-inner"><span>© 2026 Ruang Editorial</span><div class="footer-links"><a href="#">About</a><a href="#">Privacy</a><a href="#">Contact</a></div></div></footer>
</body></html>
