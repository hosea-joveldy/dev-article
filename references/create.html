<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang — Write a story</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div class="container nav">
  <a class="brand" href="index.html">Ruang.</a>
  <nav class="navlinks"><a href="main.html">Explore</a><a href="main.html#topics">Topics</a><a href="main.html" class="pill">Back to stories</a></nav>
</div></header>

<main class="article-wrap">
  <h1 class="serif" style="font-size:42px;margin:0 0 10px;font-weight:400;">Write a story.</h1>
  <p style="color:var(--muted);margin:0 0 32px;font-size:15px;">Bagikan ide, analisis, dan perspektif Anda untuk para pembaca.</p>

  <form style="display:flex;flex-direction:column;gap:24px;">
    <div>
      <label class="form-label">Story Title *</label>
      <input class="form-input" placeholder="Title" style="font-size:18px;font-weight:600;padding:14px 16px;">
    </div>
    <div>
      <label class="form-label">Topic / Category</label>
      <select class="form-input" style="padding:12px 14px;">
        <option>Business</option>
        <option>Technology</option>
        <option>Finance</option>
        <option>Productivity</option>
      </select>
    </div>
    <div>
      <label class="form-label">Content * (Markdown supported)</label>
      <textarea class="form-textarea" rows="15" placeholder="Tell your story..."></textarea>
    </div>
    <div>
      <label class="form-label">Featured Image (optional)</label>
      <input type="file" class="form-input">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--line);">
      <a href="main.html" class="pill-outline">Cancel</a>
      <button type="button" class="pill">Publish story</button>
    </div>
  </form>
</main>

<footer class="footer"><div class="container footer-inner"><span>© 2026 Ruang Editorial</span><div class="footer-links"><a href="#">About</a><a href="#">Privacy</a><a href="#">Contact</a></div></div></footer>
</body></html>
